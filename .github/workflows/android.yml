# Builds the Android app (the game from docs/ inside a full-screen WebView) and publishes it as
# https://github.com/as547777/tuhelj-gta/releases/download/android/Tuhelj.apk
name: Android APK
on:
  push:
    branches: [main]
    paths: ['docs/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key (made once, then kept in the repo so updates install over the old app)
        run: |
          if [ ! -f android/app/tuhelj.keystore ]; then
            keytool -genkeypair -v -keystore android/app/tuhelj.keystore -alias tuhelj -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tuhelj123 -keypass tuhelj123 -dname "CN=Tuhelj, O=Tuhelj, C=HR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/tuhelj.keystore
            git commit -m "Android signing key [skip ci]"
            git push
          fi
      - name: Pack the game and the icon
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r docs/* android/app/src/main/assets/www/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; cp web/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Tuhelj.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Tuhelj za Android
          make_latest: true
          body: |
            **Tuhelj — Povratak u Zagorje** za Android.

            1. Skini **Tuhelj.apk** (ispod, u Assets).
            2. Otvori datoteku na mobitelu i dopusti instalaciju iz ovog izvora kad pita.
            3. Pokreni "Tuhelj" s početnog zaslona.

            Igra radi i bez interneta (osim igranja s prijateljima). Nova verzija se instalira preko stare, napredak ostaje.
          files: Tuhelj.apk
